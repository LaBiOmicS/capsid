[project]
name = "capsid"
version = "0.1.0"
description = "Reproducible, signed, multi-architecture container images for bioinformatics tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bioinformatics", "containers", "docker", "apptainer", "nextflow", "snakemake", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
authors = [
    { name = "Fabiano Menegidio", email = "labiomics@bioinformatica.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/LaBiOmicS/capsid"
Documentation = "https://github.com/LaBiOmicS/capsid/tree/main/docs"
Issues = "https://github.com/LaBiOmicS/capsid/issues"
Changelog = "https://github.com/LaBiOmicS/capsid/blob/main/CHANGELOG.md"
Recipes = "https://github.com/LaBiOmicS/capsid-hub"

[project.scripts]
capsid = "capsid:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "types-PyYAML",
    "pytest>=9.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax for the target Python
    "B",             # bugbear
    "SIM", "C4", "PIE", "PERF", "RUF",
    "BLE",           # no blind `except Exception` without handling
    "S110",          # no silent try/except/pass
    "PLW1510",       # subprocess.run must state check=
    "EXE",
]

[tool.ruff.lint.per-file-ignores]
# Generated HTML/CSS/Markdown is kept as literal blocks
"src/capsid/docs_gen.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters through default values
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
packages = ["capsid"]
mypy_path = "src"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
